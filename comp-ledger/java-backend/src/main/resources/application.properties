server.port=3001
data.dir=${DATA_DIR:../backend/data}
aws.region=${AWS_REGION:us-east-1}
bedrock.embed-model-id=${EMBED_MODEL_ID:amazon.titan-embed-text-v2:0}
bedrock.decompose-model-id=${DECOMPOSE_MODEL_ID:anthropic.claude-haiku-4-5-20251001-v1:0}
bedrock.score-model-id=${SCORE_MODEL_ID:anthropic.claude-sonnet-4-20250514-v1:0}
s3.bucket=${S3_BUCKET:}
s3.evidence-prefix=${S3_EVIDENCE_PREFIX:evidence-records/}
spring.mvc.async.request-timeout=300000

# Spring AI - Bedrock Converse (1.0.0-M6)
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.converse.chat.enabled=true
spring.ai.bedrock.converse.chat.model=${DECOMPOSE_MODEL_ID:anthropic.claude-haiku-4-5-20251001-v1:0}
spring.ai.bedrock.converse.chat.options.max-tokens=4096
spring.main.allow-bean-definition-overriding=true

# Publisher accounts (DynamoDB)
dynamodb.publishers-table=${PUBLISHERS_TABLE:comp-ledger-publishers}
dynamodb.articles-table=${ARTICLES_TABLE:comp-ledger-articles}
dynamodb.chunks-table=${CHUNKS_TABLE:comp-ledger-chunks}
dynamodb.connectors-table=${CONNECTORS_TABLE:comp-ledger-connectors}
dynamodb.sync-jobs-table=${SYNC_JOBS_TABLE:comp-ledger-sync-jobs}
auth.enabled=${AUTH_ENABLED:true}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
