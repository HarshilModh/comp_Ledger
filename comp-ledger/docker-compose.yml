services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: comp_ledger
      POSTGRES_USER: comp
      POSTGRES_PASSWORD: comp_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comp -d comp_ledger"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
